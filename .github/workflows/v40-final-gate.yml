name: DirectVertex V40 Final Gate

on:
  workflow_dispatch:
  issues:
    types: [opened]
  push:
    branches:
      - main
      - master
    tags:
      - "v40.*"

permissions:
  contents: read

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Extract final Android package
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$(find . -maxdepth 2 -type f -name 'DirectVertexV40_ANDROID_FINAL_CLOUD_GATED_FIXED_COMPOSE_OK.zip' -print -quit)"
          test -n "$ZIP"
          OVERRIDES="$(mktemp -d)"
          mkdir -p "$OVERRIDES/app/src/main/java/com/directvertex/v40"
          cp app/src/main/java/com/directvertex/v40/MainActivity.kt "$OVERRIDES/app/src/main/java/com/directvertex/v40/MainActivity.kt"
          cp app/src/main/java/com/directvertex/v40/V15VisionEngine.kt "$OVERRIDES/app/src/main/java/com/directvertex/v40/V15VisionEngine.kt"
          cp app/src/main/java/com/directvertex/v40/V29MarketDataIntegrity.kt "$OVERRIDES/app/src/main/java/com/directvertex/v40/V29MarketDataIntegrity.kt"
          cp app/src/main/java/com/directvertex/v40/QuotexOTCResearchRecorder.kt "$OVERRIDES/app/src/main/java/com/directvertex/v40/QuotexOTCResearchRecorder.kt"
          cp app/src/main/java/com/directvertex/v40/QuotexOTCResearchPanel.kt "$OVERRIDES/app/src/main/java/com/directvertex/v40/QuotexOTCResearchPanel.kt"
          rm -rf extracted_v40 && mkdir -p extracted_v40
          unzip -q "$ZIP" -d extracted_v40
          ROOT="$(find extracted_v40 -type f -name 'settings.gradle.kts' -print -quit | xargs -r dirname)"
          test -n "$ROOT" && test -f "$ROOT/settings.gradle.kts"
          rsync -a --delete --exclude='.git/' --exclude='extracted_v40/' "$ROOT/" ./
          cp "$OVERRIDES/app/src/main/java/com/directvertex/v40/MainActivity.kt" app/src/main/java/com/directvertex/v40/MainActivity.kt
          cp "$OVERRIDES/app/src/main/java/com/directvertex/v40/V15VisionEngine.kt" app/src/main/java/com/directvertex/v40/V15VisionEngine.kt
          cp "$OVERRIDES/app/src/main/java/com/directvertex/v40/V29MarketDataIntegrity.kt" app/src/main/java/com/directvertex/v40/V29MarketDataIntegrity.kt
          cp "$OVERRIDES/app/src/main/java/com/directvertex/v40/QuotexOTCResearchRecorder.kt" app/src/main/java/com/directvertex/v40/QuotexOTCResearchRecorder.kt
          cp "$OVERRIDES/app/src/main/java/com/directvertex/v40/QuotexOTCResearchPanel.kt" app/src/main/java/com/directvertex/v40/QuotexOTCResearchPanel.kt
          rm -rf "$OVERRIDES"
          test -f settings.gradle.kts && test -d app && test -f app/build.gradle.kts
          echo "Project extracted and hotfixes restored successfully."
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0" "emulator" "system-images;android-30;google_apis;x86_64"
      - name: Enable KVM acceleration
        shell: bash
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo groupadd -r kvm 2>/dev/null || true
          sudo usermod -aG kvm "$USER" 2>/dev/null || true
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          sudo chmod 666 /dev/kvm 2>/dev/null || true
          ls -l /dev/kvm 2>/dev/null || true
      - name: Detect KVM acceleration
        shell: bash
        run: |
          set -euo pipefail
          if [ -e /dev/kvm ] && [ -r /dev/kvm ] && [ -w /dev/kvm ]; then
            echo "KVM_AVAILABLE=true" >> "$GITHUB_ENV"
            echo "KVM available; emulator will use hardware acceleration."
          else
            echo "KVM_AVAILABLE=false" >> "$GITHUB_ENV"
            echo "KVM unavailable; emulator verification will use software acceleration with extended framework readiness waits."
          fi
      - name: Static V40 preflight
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/verify_v40.sh
          bash scripts/verify_v40.sh
      - name: Gate 1 - Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:assembleDebug --no-daemon --stacktrace
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          ls -lh "$APK"
          sha256sum "$APK" | tee APK_SHA256.txt
          file "$APK"
          unzip -t "$APK" >/dev/null
      - name: Gate 2 - Android emulator install and launch
        shell: bash
        timeout-minutes: 95
        run: |
          set -euo pipefail
          APK="$GITHUB_WORKSPACE/app/build/outputs/apk/debug/app-debug.apk"
          PACKAGE="com.directvertex.v40"
          AVD="directvertex-v40"
          AVD_ROOT="$HOME/.android/avd"
          AVD_DIR="$AVD_ROOT/$AVD.avd"
          test -s "$APK"
          echo "Preparing Android API 30 emulator..."
          mkdir -p "$AVD_ROOT"
          rm -rf "$AVD_DIR" "$AVD_ROOT/$AVD.ini"
          mkdir -p "$AVD_DIR"
          cat > "$AVD_ROOT/$AVD.ini" <<EOF
          avd.ini.encoding=UTF-8
          path=$AVD_DIR
          path.rel=avd/$AVD.avd
          target=android-30
          EOF
          cat > "$AVD_DIR/config.ini" <<EOF
          AvdId=$AVD
          PlayStore.enabled=false
          abi.type=x86_64
          avd.ini.displayname=DirectVertex V40 API 30
          avd.ini.encoding=UTF-8
          disk.dataPartition.size=2G
          fastboot.forceColdBoot=yes
          fastboot.forceFastBoot=no
          hw.accelerometer=yes
          hw.audioInput=no
          hw.battery=yes
          hw.camera.back=virtualscene
          hw.camera.front=emulated
          hw.cpu.arch=x86_64
          hw.cpu.ncore=2
          hw.device.manufacturer=Google
          hw.device.name=pixel_2
          hw.gps=yes
          hw.gpu.enabled=yes
          hw.gpu.mode=swiftshader_indirect
          hw.keyboard=yes
          hw.lcd.density=420
          hw.lcd.height=1920
          hw.lcd.width=1080
          hw.ramSize=2048
          hw.sdCard=yes
          image.sysdir.1=system-images/android-30/google_apis/x86_64/
          runtime.network.latency=none
          runtime.network.speed=full
          showDeviceFrame=no
          skin.dynamic=yes
          skin.name=1080x1920
          tag.display=Google APIs
          tag.id=google_apis
          vm.heapSize=512M
          EOF
          test -f "$AVD_DIR/config.ini"
          if [ "${KVM_AVAILABLE:-false}" = "true" ]; then ACCEL="on"; else ACCEL="off"; fi
          echo "Launching emulator with accel=$ACCEL"
          nohup "$ANDROID_HOME/emulator/emulator" -avd "$AVD" -port 5554 -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot -wipe-data -accel "$ACCEL" > "$GITHUB_WORKSPACE/emulator.log" 2>&1 &
          EMU_PID=$!
          trap 'adb -s emulator-5554 emu kill >/dev/null 2>&1 || true; kill "$EMU_PID" >/dev/null 2>&1 || true' EXIT
          adb start-server >/dev/null
          echo "Waiting for emulator/ADB..."
          BOOT_OK=false
          for i in $(seq 1 420); do
            STATE="$(adb -s emulator-5554 get-state 2>/dev/null || true)"
            BOOT="$(adb -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
            if [ "$STATE" = "device" ] && [ "$BOOT" = "1" ]; then BOOT_OK=true; break; fi
            if ! kill -0 "$EMU_PID" 2>/dev/null; then
              echo "Emulator process exited unexpectedly."
              tail -300 "$GITHUB_WORKSPACE/emulator.log" || true
              exit 1
            fi
            sleep 2
          done
          if [ "$BOOT_OK" != "true" ]; then
            echo "Emulator failed to boot within timeout."
            tail -400 "$GITHUB_WORKSPACE/emulator.log" || true
            exit 1
          fi
          test "$(adb -s emulator-5554 get-state)" = "device"
          test "$(adb -s emulator-5554 shell getprop sys.boot_completed | tr -d '\r')" = "1"
          echo "Waiting for stable Android framework/package manager..."
          PM_READY=false
          STABLE_COUNT=0
          for i in $(seq 1 600); do
            BOOT_STATE="$(adb -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
            PM_SERVICE="$(adb -s emulator-5554 shell service check package 2>/dev/null || true)"
            SETTINGS_SERVICE="$(adb -s emulator-5554 shell service check settings 2>/dev/null || true)"
            ACTIVITY_SERVICE="$(adb -s emulator-5554 shell service check activity 2>/dev/null || true)"
            if [ "$BOOT_STATE" = "1" ] && printf '%s' "$PM_SERVICE" | grep -q "found" && printf '%s' "$SETTINGS_SERVICE" | grep -q "found" && printf '%s' "$ACTIVITY_SERVICE" | grep -q "found" && adb -s emulator-5554 shell cmd package list packages >/dev/null 2>&1; then
              STABLE_COUNT=$((STABLE_COUNT + 1))
              if [ "$STABLE_COUNT" -ge 3 ]; then PM_READY=true; break; fi
            else
              STABLE_COUNT=0
            fi
            if [ $((i % 20)) -eq 0 ]; then echo "framework wait ${i}x2s: package=[$PM_SERVICE] settings=[$SETTINGS_SERVICE] activity=[$ACTIVITY_SERVICE] stable=$STABLE_COUNT"; fi
            sleep 2
          done
          if [ "$PM_READY" != "true" ]; then
            echo "Android framework/package manager did not become stable."
            adb -s emulator-5554 shell service check package || true
            adb -s emulator-5554 shell service check settings || true
            adb -s emulator-5554 shell service check activity || true
            adb -s emulator-5554 logcat -d -t 1200 | tail -700 || true
            tail -500 "$GITHUB_WORKSPACE/emulator.log" || true
            exit 1
          fi
          echo "Installing APK using push + pm install..."
          adb -s emulator-5554 push "$APK" /data/local/tmp/directvertex-v40.apk
          echo "Re-checking framework after APK transfer..."
          POST_PUSH_READY=false
          STABLE_COUNT=0
          for i in $(seq 1 180); do
            PM_SERVICE="$(adb -s emulator-5554 shell service check package 2>/dev/null || true)"
            SETTINGS_SERVICE="$(adb -s emulator-5554 shell service check settings 2>/dev/null || true)"
            ACTIVITY_SERVICE="$(adb -s emulator-5554 shell service check activity 2>/dev/null || true)"
            if printf '%s' "$PM_SERVICE" | grep -q "found" && printf '%s' "$SETTINGS_SERVICE" | grep -q "found" && printf '%s' "$ACTIVITY_SERVICE" | grep -q "found" && adb -s emulator-5554 shell cmd package list packages >/dev/null 2>&1; then
              STABLE_COUNT=$((STABLE_COUNT + 1))
              if [ "$STABLE_COUNT" -ge 3 ]; then POST_PUSH_READY=true; break; fi
            else
              STABLE_COUNT=0
            fi
            sleep 2
          done
          if [ "$POST_PUSH_READY" != "true" ]; then
            echo "Package manager became unavailable after APK transfer."
            adb -s emulator-5554 shell service check package || true
            adb -s emulator-5554 shell service check settings || true
            adb -s emulator-5554 shell service check activity || true
            adb -s emulator-5554 logcat -d -t 1200 | tail -700 || true
            tail -500 "$GITHUB_WORKSPACE/emulator.log" || true
            exit 1
          fi
          INSTALL_OK=false
          for attempt in 1 2 3; do
            if adb -s emulator-5554 shell pm install -r -t /data/local/tmp/directvertex-v40.apk; then INSTALL_OK=true; break; fi
            echo "pm install attempt $attempt failed; refreshing ADB connection..."
            adb -s emulator-5554 reconnect offline >/dev/null 2>&1 || true
            sleep 5
          done
          if [ "$INSTALL_OK" != "true" ]; then
            echo "APK installation failed after retries."
            adb -s emulator-5554 shell service check package || true
            adb -s emulator-5554 logcat -d -t 1200 | tail -700 || true
            tail -500 "$GITHUB_WORKSPACE/emulator.log" || true
            exit 1
          fi
          adb -s emulator-5554 shell rm -f /data/local/tmp/directvertex-v40.apk || true
          adb -s emulator-5554 shell pm path "$PACKAGE"
          adb -s emulator-5554 shell monkey -p "$PACKAGE" 1 >/tmp/directvertex-monkey.txt
          sleep 15
          echo "Checking running process..."
          adb -s emulator-5554 shell dumpsys package "$PACKAGE" | head -120
          PID="$(adb -s emulator-5554 shell pidof "$PACKAGE" | tr -d '\r' || true)"
          test -n "$PID"
          echo "PID=$PID"
          echo "Checking fatal Android exceptions..."
          if adb -s emulator-5554 logcat -d -t 1200 | grep -iE "FATAL EXCEPTION|AndroidRuntime" | grep -q .; then
            echo "Fatal Android exception detected."
            adb -s emulator-5554 logcat -d -t 400 | tail -300
            exit 1
          fi
          adb -s emulator-5554 exec-out screencap -p > "$GITHUB_WORKSPACE/emulator-screenshot.png"
          test -s "$GITHUB_WORKSPACE/emulator-screenshot.png"
          echo "Gate 2 PASS: emulator booted, framework stabilized, APK installed, app launched, process alive, screenshot captured."
      - name: Gate 3 - Final APK verification report
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          SHA="$(sha256sum "$APK" | awk '{print $1}')"
          SIZE="$(stat -c%s "$APK")"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          if [ "${KVM_AVAILABLE:-false}" = "true" ]; then EMU_MODE="KVM hardware-accelerated verification"; else EMU_MODE="software-accelerated emulator verification (KVM unavailable on hosted runner)"; fi
          cat > V40_APK_VERIFIED.txt <<EOF
          DirectVertex V40 APK VERIFIED
          Package: com.directvertex.v40
          Version: 40.0.0
          APK: app/build/outputs/apk/debug/app-debug.apk
          SHA-256: $SHA
          Size-bytes: $SIZE
          Build: Gradle 8.13 / Java 17 / compileSdk 36 / targetSdk 36 / minSdk 23 / Build Tools 35.0.0
          Emulator: API 30 / google_apis / x86_64 / $EMU_MODE
          Gates: Gate 1 PASS; Gate 2 PASS; Gate 3 PASS
          APK ZIP integrity: PASS
          Generated at: $(date -u +"%Y-%m-%dT%H:%M:%SZ")
          EOF
          cat V40_APK_VERIFIED.txt
      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: DirectVertexV40-APK-VERIFIED
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            APK_SHA256.txt
            V40_APK_VERIFIED.txt
            emulator-screenshot.png
          if-no-files-found: error
          retention-days: 30
