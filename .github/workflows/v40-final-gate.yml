name: DirectVertex V40 Final Gate

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - "v40.*"

permissions:
  contents: read

jobs:
  build-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract final Android package
        shell: bash
        run: |
          set -euo pipefail

          ZIP="$(find . -maxdepth 2 -type f \
            -name 'DirectVertexV40_ANDROID_FINAL_CLOUD_GATED.zip' \
            -print -quit)"

          if [ -z "$ZIP" ]; then
            echo "ERROR: Final package ZIP not found."
            find . -maxdepth 3 -type f | sort | head -200
            exit 1
          fi

          rm -rf extracted_v40
          mkdir -p extracted_v40
          unzip -q "$ZIP" -d extracted_v40

          ROOT="$(find extracted_v40 -type f \
            -name 'settings.gradle.kts' \
            -print -quit | xargs -r dirname)"

          if [ -z "$ROOT" ] || [ ! -f "$ROOT/settings.gradle.kts" ]; then
            echo "ERROR: Android project root not found."
            find extracted_v40 -maxdepth 5 -type f | sort | head -300
            exit 1
          fi

          echo "Android project root: $ROOT"

          rsync -a --delete \
            --exclude='.git/' \
            --exclude='extracted_v40/' \
            "$ROOT/" ./

          echo "Project extracted successfully."
          test -f settings.gradle.kts
          test -d app
          test -f app/build.gradle.kts

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''
        

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "emulator" \
            "system-images;android-35;google_apis;x86_64"

      - name: Static V40 preflight
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/verify_v40.sh
          bash scripts/verify_v40.sh

      - name: Gate 1 - Build debug APK
        shell: bash
        run: |
          set -euo pipefail

          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"
          test -s "$APK"

          echo "APK created:"
          ls -lh "$APK"

          echo "APK SHA-256:"
          sha256sum "$APK" | tee APK_SHA256.txt

          echo "APK file type:"
          file "$APK"

          echo "APK ZIP integrity:"
          unzip -t "$APK" >/dev/null

      - name: Gate 2 - Android emulator install and launch
        uses: ReactiveCircus/android-emulator-runner@v2
        timeout-minutes: 15
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          heap-size: 512M
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: |
            set -euo pipefail

            APK="app/build/outputs/apk/debug/app-debug.apk"
            PACKAGE="com.directvertex.v40"

            test -s "$APK"

            adb install -r "$APK"

            echo "Installed package:"
            adb shell pm path "$PACKAGE"

            echo "Launching application:"
            adb shell monkey -p "$PACKAGE" 1

            sleep 8

            echo "Package information:"
            adb shell dumpsys package "$PACKAGE" | head -80

            echo "Running process check:"
            adb shell pidof "$PACKAGE" || true

            echo "Capturing emulator screenshot:"
            adb exec-out screencap -p > emulator-screenshot.png

            test -s emulator-screenshot.png

      - name: Gate 3 - Final APK verification report
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"

          SHA="$(sha256sum "$APK" | awk '{print $1}')"
          SIZE="$(stat -c%s "$APK")"

          cat > V40_APK_VERIFIED.txt <<EOF
          DirectVertex V40 APK VERIFIED

          Package: com.directvertex.v40
          Version: 40.0.0
          APK: app/build/outputs/apk/debug/app-debug.apk
          SHA-256: $SHA
          Size-bytes: $SIZE

          Build:
          Gradle: 8.13
          Java: 17
          compileSdk: 36
          targetSdk: 36
          minSdk: 23
          Build Tools: 35.0.0

          Emulator:
          API: 35
          Target: google_apis
          Architecture: x86_64

          Gates:
          Gate 1 = APK build and integrity PASS
          Gate 2 = Emulator install and launch PASS
          Gate 3 = Final verification report PASS

          Generated at:
          $(date -u +"%Y-%m-%dT%H:%M:%SZ")
          EOF

          cat V40_APK_VERIFIED.txt

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: DirectVertexV40-APK-VERIFIED
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            APK_SHA256.txt
            V40_APK_VERIFIED.txt
            emulator-screenshot.png
          if-no-files-found: error
          retention-days: 30
